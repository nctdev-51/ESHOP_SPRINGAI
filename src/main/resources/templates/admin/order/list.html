<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý Đơn hàng')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1"><i class="fa-solid fa-truck-fast text-primary me-2"></i>Quản Lý Đơn Hàng</h3>
            <p class="text-muted mb-0">Theo dõi toàn bộ đơn hàng và xử lý vận chuyển</p>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Mã đơn</th>
                        <th>Ngày tạo</th>
                        <th>Khách hàng</th>
                        <th>Số điện thoại</th>
                        <th>Phương thức</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái</th>
                        <th class="text-end">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="o : ${orders}">
                        <td><strong class="text-primary" th:text="${'#' + o.id}"></strong></td>
                        <td th:text="${#temporals.format(o.orderDate, 'dd/MM/yyyy HH:mm')}"></td>
                        <td class="fw-semibold" th:text="${o.customerName}"></td>
                        <td th:text="${o.phone}"></td>
                        <td><span class="badge bg-secondary" th:text="${o.paymentMethod}"></span></td>
                        <td class="fw-bold text-danger" th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT') + ' đ'}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${o.status.name() == 'NEW' ? 'bg-primary' : (o.status.name() == 'PAID' ? 'bg-info text-dark' : (o.status.name() == 'CONFIRMED' ? 'bg-warning text-dark' : (o.status.name() == 'SHIPPING' ? 'bg-secondary' : (o.status.name() == 'COMPLETED' ? 'bg-success' : 'bg-danger'))))}"
                                  th:text="${o.status}">
                            </span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/admin/orders/{id}(id=${o.id})}" class="btn btn-sm btn-outline-primary me-1" title="Xem chi tiết & Cập nhật">
                                <i class="fa-solid fa-pen-to-square"></i> Chi tiết
                            </a>
                            <form th:action="@{/admin/orders/{id}/delete(id=${o.id})}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc chắn muốn xóa đơn hàng này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
