<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý Sản phẩm')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1"><i class="fa-solid fa-box text-primary me-2"></i>Quản Lý Sản Phẩm</h3>
            <p class="text-muted mb-0">Quản lý kho hàng, giá bán và hình ảnh sản phẩm</p>
        </div>
        <a th:href="@{/admin/products/new}" class="btn btn-primary">
            <i class="fa-solid fa-plus me-1"></i> Thêm sản phẩm mới
        </a>
    </div>

    <!-- Thanh tìm kiếm & lọc -->
    <div class="card shadow-sm border-0 mb-4 p-3">
        <form th:action="@{/admin/products}" method="get" class="row g-2 align-items-center">
            <div class="col-md-4">
                <input type="text" name="keyword" class="form-control" placeholder="Tìm kiếm theo tên sản phẩm..." th:value="${keyword}">
            </div>
            <div class="col-md-4">
                <select name="categoryId" class="form-select">
                    <option value="">Tất cả danh mục</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == categoryId}"></option>
                </select>
            </div>
            <div class="col-md-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary flex-grow-1">
                    <i class="fa-solid fa-filter me-1"></i> Lọc
                </button>
                <a th:href="@{/admin/products}" class="btn btn-outline-secondary">Đặt lại</a>
            </div>
        </form>
    </div>

    <!-- Bảng danh sách sản phẩm -->
    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th style="width: 70px;">ID</th>
                        <th>Hình ảnh</th>
                        <th>Tên sản phẩm</th>
                        <th>Danh mục</th>
                        <th>Giá bán</th>
                        <th>Tồn kho</th>
                        <th class="text-end" style="width: 140px;">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${products.content}">
                        <td><strong th:text="${'#' + p.id}"></strong></td>
                        <td>
                            <img th:src="${p.imageUrl != null && !p.imageUrl.empty ? p.imageUrl : 'https://placehold.co/80x80/e2e8f0/475569?text=' + p.name}"
                                 class="rounded border" style="width: 50px; height: 50px; object-fit: cover;"
                                 onerror="this.src='https://placehold.co/80x80/e2e8f0/475569?text=eShop'">
                        </td>
                        <td>
                            <div class="fw-semibold text-dark" th:text="${p.name}"></div>
                        </td>
                        <td>
                            <span class="badge bg-light text-dark border" th:text="${p.category.name}"></span>
                        </td>
                        <td class="fw-bold text-danger" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT') + ' đ'}"></td>
                        <td>
                            <span class="badge" th:classappend="${p.quantity > 5 ? 'bg-success' : (p.quantity > 0 ? 'bg-warning text-dark' : 'bg-danger')}"
                                  th:text="${p.quantity + ' chiếc'}"></span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/admin/products/{id}/edit(id=${p.id})}" class="btn btn-sm btn-outline-secondary me-1" title="Sửa">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </a>
                            <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Phân trang -->
    <div class="d-flex justify-content-center mt-4" th:if="${totalPages > 1}">
        <nav>
            <ul class="pagination">
                <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/admin/products(page=${currentPage - 1}, keyword=${keyword}, categoryId=${categoryId})}">Trước</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${i == currentPage ? 'active' : ''}">
                    <a class="page-link" th:href="@{/admin/products(page=${i}, keyword=${keyword}, categoryId=${categoryId})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/admin/products(page=${currentPage + 1}, keyword=${keyword}, categoryId=${categoryId})}">Sau</a>
                </li>
            </ul>
        </nav>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
