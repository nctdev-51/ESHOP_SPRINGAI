<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chi tiết đơn hàng #' + ${order.id})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1">
                <i class="fa-solid fa-file-invoice me-2 text-primary"></i> Đơn Hàng <span th:text="${'#' + order.id}"></span>
            </h3>
            <span class="text-muted">Đặt ngày: </span>
            <span th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm:ss')}"></span>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/orders}" class="btn btn-outline-secondary">
                <i class="fa-solid fa-arrow-left me-1"></i> Quay lại đơn hàng
            </a>
            <a th:if="${order.paymentMethod.name() == 'BANKING' && order.status.name() == 'NEW'}"
               th:href="@{/orders/{id}/payment(id=${order.id})}" class="btn btn-warning">
                <i class="fa-solid fa-qrcode me-1"></i> Chuyển khoản ngay
            </a>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 h-100 p-4">
                <h5 class="fw-bold border-bottom pb-2 mb-3">Thông Tin Giao Hàng</h5>
                <p class="mb-2"><strong>Người nhận:</strong> <span th:text="${order.customerName}"></span></p>
                <p class="mb-2"><strong>Số điện thoại:</strong> <span th:text="${order.phone}"></span></p>
                <p class="mb-2"><strong>Địa chỉ:</strong> <span th:text="${order.address}"></span></p>
                <p class="mb-0"><strong>Ghi chú:</strong> <span th:text="${order.note != null && !order.note.empty ? order.note : 'Không có'}"></span></p>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm border-0 h-100 p-4">
                <h5 class="fw-bold border-bottom pb-2 mb-3">Trạng Thái Đơn Hàng</h5>
                <p class="mb-2">
                    <strong>Trạng thái: </strong>
                    <span class="badge fs-6"
                          th:classappend="${order.status.name() == 'NEW' ? 'bg-primary' : (order.status.name() == 'PAID' ? 'bg-info text-dark' : (order.status.name() == 'CONFIRMED' ? 'bg-warning text-dark' : (order.status.name() == 'SHIPPING' ? 'bg-secondary' : (order.status.name() == 'COMPLETED' ? 'bg-success' : 'bg-danger'))))}"
                          th:text="${order.status}">
                    </span>
                </p>
                <p class="mb-2">
                    <strong>Phương thức thanh toán: </strong>
                    <span class="badge bg-secondary fs-6" th:text="${order.paymentMethod}"></span>
                </p>
                <p class="mb-0" th:if="${order.user != null}">
                    <strong>Tài khoản đặt: </strong>
                    <span th:text="${order.user.username}"></span>
                </p>
            </div>
        </div>
    </div>

    <!-- Chi tiết sản phẩm -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
            <h5 class="fw-bold mb-0">Danh Sách Mặt Hàng</h5>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Sản phẩm</th>
                        <th>Đơn giá</th>
                        <th>Số lượng</th>
                        <th class="text-end">Thành tiền</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="d : ${order.details}">
                        <td>
                            <div class="fw-bold" th:text="${d.product.name}"></div>
                            <small class="text-muted" th:text="${d.product.category.name}"></small>
                        </td>
                        <td th:text="${#numbers.formatDecimal(d.unitPrice, 0, 'COMMA', 0, 'POINT') + ' đ'}"></td>
                        <td th:text="${d.quantity}"></td>
                        <td class="text-end fw-bold text-danger" th:text="${#numbers.formatDecimal(d.subtotal, 0, 'COMMA', 0, 'POINT') + ' đ'}"></td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="3" class="text-end fw-bold fs-5">Tổng Tiền:</td>
                        <td class="text-end fw-bold fs-4 text-danger" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT') + ' đ'}"></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
