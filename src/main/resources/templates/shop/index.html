<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sản phẩm')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container">
    <!-- Hero / Filter Section -->
    <div class="row mb-4 align-items-center">
        <div class="col-lg-6">
            <h2 class="fw-bold mb-1 text-dark">Danh Sách Sản Phẩm</h2>
            <p class="text-muted mb-0">Khám phá các sản phẩm công nghệ chất lượng hàng đầu</p>
        </div>
        <div class="col-lg-6 mt-3 mt-lg-0">
            <form th:action="@{/products}" method="get" class="d-flex gap-2">
                <select name="categoryId" class="form-select" style="max-width: 200px;">
                    <option value="">Tất cả danh mục</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}"
                            th:text="${cat.name}"
                            th:selected="${cat.id == categoryId}"></option>
                </select>
                <div class="input-group">
                    <input type="text" name="keyword" class="form-control" placeholder="Tìm tên sản phẩm..." th:value="${keyword}">
                    <button class="btn btn-primary" type="submit">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Product Grid -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" th:if="${products.totalElements > 0}">
        <div class="col" th:each="p : ${products.content}">
            <div class="card h-100 product-card">
                <img th:src="${p.imageUrl != null && !p.imageUrl.empty ? p.imageUrl : 'https://placehold.co/400x300/e2e8f0/475569?text=' + p.name}"
                     class="card-img-top" th:alt="${p.name}"
                     onerror="this.src='https://placehold.co/400x300/e2e8f0/475569?text=eShop'">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge bg-light text-primary border" th:text="${p.category.name}">Category</span>
                        <span class="badge bg-success-subtle text-success badge-stock" th:if="${p.quantity > 0}">
                            Còn <span th:text="${p.quantity}"></span>
                        </span>
                        <span class="badge bg-danger-subtle text-danger badge-stock" th:unless="${p.quantity > 0}">
                            Hết hàng
                        </span>
                    </div>
                    <h6 class="card-title fw-bold text-truncate" th:text="${p.name}" th:title="${p.name}">Product Name</h6>
                    <p class="card-text text-muted small flex-grow-1" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;"
                       th:text="${p.description != null ? p.description : 'Sản phẩm chính hãng với bảo hành uy tín.'}"></p>
                    <div class="mt-2 pt-2 border-top d-flex justify-content-between align-items-center">
                        <div class="product-price" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT') + ' đ'}">1.000.000 đ</div>
                    </div>
                </div>
                <div class="card-footer bg-white border-0 pt-0 pb-3 d-flex gap-2">
                    <a th:href="@{/products/{id}(id=${p.id})}" class="btn btn-sm btn-outline-secondary flex-fill">Chi tiết</a>
                    <form th:action="@{/cart/add}" method="post" class="flex-fill">
                        <input type="hidden" name="productId" th:value="${p.id}">
                        <input type="hidden" name="quantity" value="1">
                        <button type="submit" class="btn btn-sm btn-primary w-100" th:disabled="${p.quantity <= 0}">
                            <i class="fa-solid fa-cart-plus me-1"></i> Mua
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div class="text-center py-5" th:if="${products.totalElements == 0}">
        <i class="fa-solid fa-box-open text-muted fa-4x mb-3"></i>
        <h5 class="fw-bold">Không tìm thấy sản phẩm nào!</h5>
        <p class="text-muted">Hãy thử thay đổi từ khóa hoặc danh mục tìm kiếm.</p>
        <a th:href="@{/products}" class="btn btn-outline-primary">Xem tất cả sản phẩm</a>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-center mt-5" th:if="${totalPages > 1}">
        <nav>
            <ul class="pagination">
                <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/products(page=${currentPage - 1}, keyword=${keyword}, categoryId=${categoryId})}">Trước</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                    th:classappend="${i == currentPage ? 'active' : ''}">
                    <a class="page-link" th:href="@{/products(page=${i}, keyword=${keyword}, categoryId=${categoryId})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/products(page=${currentPage + 1}, keyword=${keyword}, categoryId=${categoryId})}">Sau</a>
                </li>
            </ul>
        </nav>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
