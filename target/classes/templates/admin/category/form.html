<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${category.id != null ? 'Sửa Danh mục' : 'Thêm Danh mục'})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container" style="max-width: 600px;">
    <div class="card shadow-sm border-0 p-4">
        <h4 class="fw-bold mb-4">
            <i class="fa-solid fa-tag text-primary me-2"></i>
            <span th:text="${category.id != null ? 'Chỉnh Sửa Danh Mục' : 'Thêm Danh Mục Mới'}"></span>
        </h4>

        <form th:action="${category.id != null ? '/admin/categories/' + category.id + '/edit' : '/admin/categories'}"
              th:object="${category}" method="post">
            <input type="hidden" th:field="*{id}" th:if="${category.id != null}">

            <div class="mb-3">
                <label class="form-label fw-semibold">Tên danh mục <span class="text-danger">*</span></label>
                <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name') ? 'is-invalid' : ''}" placeholder="Ví dụ: Laptop Gaming">
                <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Mô tả</label>
                <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Mô tả danh mục..."></textarea>
            </div>

            <div class="d-flex justify-content-between">
                <a th:href="@{/admin/categories}" class="btn btn-outline-secondary">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary px-4">
                    <i class="fa-solid fa-save me-1"></i> Lưu danh mục
                </button>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
