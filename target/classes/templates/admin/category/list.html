<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý Danh mục')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1"><i class="fa-solid fa-tags text-primary me-2"></i>Quản Lý Danh Mục</h3>
            <p class="text-muted mb-0">Danh sách tất cả các danh mục sản phẩm</p>
        </div>
        <a th:href="@{/admin/categories/new}" class="btn btn-primary">
            <i class="fa-solid fa-plus me-1"></i> Thêm danh mục
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th style="width: 80px;">ID</th>
                        <th>Tên danh mục</th>
                        <th>Mô tả</th>
                        <th class="text-end" style="width: 150px;">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cat : ${categories}">
                        <td><strong th:text="${'#' + cat.id}"></strong></td>
                        <td class="fw-semibold text-primary" th:text="${cat.name}"></td>
                        <td class="text-muted" th:text="${cat.description}"></td>
                        <td class="text-end">
                            <a th:href="@{/admin/categories/{id}/edit(id=${cat.id})}" class="btn btn-sm btn-outline-secondary me-1">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </a>
                            <form th:action="@{/admin/categories/{id}/delete(id=${cat.id})}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc chắn muốn xóa danh mục này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
