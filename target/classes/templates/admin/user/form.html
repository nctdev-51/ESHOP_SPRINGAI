<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${userForm.id != null ? 'Sửa Người dùng' : 'Tạo Người dùng'})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container" style="max-width: 640px;">
    <div class="card shadow-sm border-0 p-4">
        <h4 class="fw-bold mb-4">
            <i class="fa-solid fa-user-gear text-primary me-2"></i>
            <span th:text="${userForm.id != null ? 'Chỉnh Sửa Người Dùng #' + userForm.id : 'Tạo Người Dùng Mới'}"></span>
        </h4>

        <form th:action="${userForm.id != null ? '/admin/users/' + userForm.id + '/edit' : '/admin/users'}"
              th:object="${userForm}" method="post">
            <input type="hidden" th:field="*{id}" th:if="${userForm.id != null}">

            <div class="mb-3">
                <label class="form-label fw-semibold">Tên đăng nhập <span class="text-danger">*</span></label>
                <input type="text" th:field="*{username}" class="form-control"
                       th:classappend="${#fields.hasErrors('username') ? 'is-invalid' : ''}"
                       th:readonly="${userForm.id != null}" placeholder="username">
                <div class="invalid-feedback" th:errors="*{username}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    Mật khẩu <span class="text-danger" th:if="${userForm.id == null}">*</span>
                    <small class="text-muted" th:if="${userForm.id != null}">(Để trống nếu không đổi)</small>
                </label>
                <input type="password" th:field="*{password}" class="form-control"
                       th:classappend="${#fields.hasErrors('password') ? 'is-invalid' : ''}" placeholder="••••••">
                <div class="invalid-feedback" th:errors="*{password}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                <input type="text" th:field="*{fullName}" class="form-control"
                       th:classappend="${#fields.hasErrors('fullName') ? 'is-invalid' : ''}" placeholder="Nguyễn Văn A">
                <div class="invalid-feedback" th:errors="*{fullName}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                <input type="email" th:field="*{email}" class="form-control"
                       th:classappend="${#fields.hasErrors('email') ? 'is-invalid' : ''}" placeholder="email@domain.com">
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Số điện thoại</label>
                    <input type="tel" th:field="*{phone}" class="form-control" placeholder="0901234567">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Địa chỉ</label>
                    <input type="text" th:field="*{address}" class="form-control" placeholder="Địa chỉ...">
                </div>
            </div>

            <div class="row g-2 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Vai trò (Role)</label>
                    <select th:field="*{role}" class="form-select">
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r.name()}"></option>
                    </select>
                </div>
                <div class="col-md-6 d-flex align-items-center mt-4">
                    <div class="form-check form-switch fs-5">
                        <input class="form-check-input" type="checkbox" th:field="*{enabled}" id="enabledSwitch">
                        <label class="form-check-label fs-6 fw-semibold ms-2" for="enabledSwitch">Kích hoạt tài khoản</label>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between">
                <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary px-4">
                    <i class="fa-solid fa-save me-1"></i> Lưu người dùng
                </button>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
