<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý Người dùng')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1"><i class="fa-solid fa-users text-primary me-2"></i>Quản Lý Tài Khoản</h3>
            <p class="text-muted mb-0">Danh sách tài khoản khách hàng và người bán hàng</p>
        </div>
        <a th:href="@{/admin/users/new}" class="btn btn-primary">
            <i class="fa-solid fa-user-plus me-1"></i> Tạo tài khoản mới
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th style="width: 70px;">ID</th>
                        <th>Tên đăng nhập</th>
                        <th>Họ và tên</th>
                        <th>Email</th>
                        <th>Vai trò</th>
                        <th>Trạng thái</th>
                        <th>Ngày tạo</th>
                        <th class="text-end" style="width: 170px;">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td><strong th:text="${'#' + u.id}"></strong></td>
                        <td class="fw-semibold" th:text="${u.username}"></td>
                        <td th:text="${u.fullName}"></td>
                        <td class="text-muted" th:text="${u.email}"></td>
                        <td>
                            <span class="badge" th:classappend="${u.role.name() == 'ROLE_SELLER' ? 'bg-danger' : 'bg-primary'}"
                                  th:text="${u.role.name()}"></span>
                        </td>
                        <td>
                            <span class="badge" th:classappend="${u.enabled ? 'bg-success' : 'bg-secondary'}"
                                  th:text="${u.enabled ? 'Hoạt động' : 'Đã khóa'}"></span>
                        </td>
                        <td class="text-muted small" th:text="${#temporals.format(u.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                        <td class="text-end">
                            <form th:action="@{/admin/users/{id}/toggle-status(id=${u.id})}" method="post" class="d-inline"
                                  th:onsubmit="return confirm('Bạn có chắc muốn đổi trạng thái tài khoản này?');">
                                <button type="submit" class="btn btn-sm" th:classappend="${u.enabled ? 'btn-outline-warning' : 'btn-outline-success'}"
                                        th:title="${u.enabled ? 'Khóa tài khoản' : 'Mở khóa tài khoản'}">
                                    <i class="fa-solid" th:classappend="${u.enabled ? 'fa-lock' : 'fa-lock-open'}"></i>
                                </button>
                            </form>
                            <a th:href="@{/admin/users/{id}/edit(id=${u.id})}" class="btn btn-sm btn-outline-secondary" title="Sửa">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </a>
                            <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Bạn có chắc chắn muốn xóa tài khoản này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
