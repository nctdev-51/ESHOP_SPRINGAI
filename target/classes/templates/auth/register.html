<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng ký tài khoản')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container" style="max-width: 540px;">
    <div class="card shadow border-0 mt-3 p-4">
        <div class="text-center mb-4">
            <h4 class="fw-bold mb-1"><i class="fa-solid fa-user-plus text-primary me-2"></i>Đăng Ký Khách Hàng</h4>
            <p class="text-muted small">Tạo tài khoản để trải nghiệm mua sắm nhanh chóng</p>
        </div>

        <form th:action="@{/register}" th:object="${form}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Tên đăng nhập <span class="text-danger">*</span></label>
                <input type="text" th:field="*{username}" class="form-control" th:classappend="${#fields.hasErrors('username') ? 'is-invalid' : ''}" placeholder="Từ 4 - 50 ký tự">
                <div class="invalid-feedback" th:errors="*{username}"></div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                    <input type="password" th:field="*{password}" class="form-control" th:classappend="${#fields.hasErrors('password') ? 'is-invalid' : ''}" placeholder="Tối thiểu 6 ký tự">
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                    <input type="password" th:field="*{confirmPassword}" class="form-control" th:classappend="${#fields.hasErrors('confirmPassword') ? 'is-invalid' : ''}" placeholder="Nhập lại mật khẩu">
                    <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                <input type="text" th:field="*{fullName}" class="form-control" th:classappend="${#fields.hasErrors('fullName') ? 'is-invalid' : ''}" placeholder="Nguyễn Văn A">
                <div class="invalid-feedback" th:errors="*{fullName}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email') ? 'is-invalid' : ''}" placeholder="name@example.com">
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>

            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Số điện thoại</label>
                    <input type="tel" th:field="*{phone}" class="form-control" placeholder="0901234567">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Địa chỉ</label>
                    <input type="text" th:field="*{address}" class="form-control" placeholder="Hà Nội, TP.HCM...">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-2">
                <i class="fa-solid fa-check me-2"></i> Hoàn Tất Đăng Ký
            </button>
        </form>

        <div class="text-center mt-3">
            <span class="text-muted">Đã có tài khoản?</span>
            <a th:href="@{/login}" class="fw-semibold text-decoration-none">Đăng nhập</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
